name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Source and Binary Wheels
        run: |
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Glyph - Text Extractor ${{ github.ref_name }}"
          body: |
            ### Glyph - Text Extractor 🔍
            **Lightning-fast screen text extractor for Linux desktops (PowerToys Text Extractor alternative).**

            #### Highlights:
            * **Mode A (Instant):** Fast background sniper capture directly to your system clipboard (`glyph --grab` / `Super+Shift+T`).
            * **Mode B (Review & Edit):** Native GTK4 Libadwaita text formatting and cleanup modal (`glyph --grab --edit` / `Super+Shift+E`).
            * **Universal Compositor Support:** Native Wayland (GNOME, KDE, Hyprland, Sway) and X11 integration.
            * **Zero Telemetry & Offline:** Private offline OCR powered by Tesseract 5.4.1.

            ---
            *Pre-built Python wheels and source distributions are attached below.*
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
