name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools & packaging utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          python -m pip install --upgrade pip
          pip install build

      - name: Build Source and Binary Wheels
        run: |
          python -m build

      - name: Build Debian Package (.deb)
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Build RPM Package (.rpm)
        run: |
          chmod +x build_rpm.sh
          ./build_rpm.sh

      - name: Build Universal Portable Release Archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_DIR="glyph-${VERSION}-linux-all"
          mkdir -p "$ARCHIVE_DIR"
          cp -r src assets data install.sh uninstall.sh pyproject.toml README.md LICENSE "$ARCHIVE_DIR/"
          tar -czf "dist/glyph-${VERSION}-linux-portable.tar.gz" "$ARCHIVE_DIR"

      - name: Generate Artifact Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          python3 -c '
          import re, os
          tag = os.environ.get("GITHUB_REF_NAME", "")
          version = tag.lstrip("v")
          
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()
              
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
          else:
              notes = f"Release {tag}"
              
          body = f"""## Glyph - Text Extractor {tag}

          {notes}

          ### Verification
          Verify asset integrity with SHA-256 checksums:
          ```bash
          sha256sum -c SHA256SUMS.txt
          ```
          """
          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as out:
              out.write(body.strip() + "\n")
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Glyph - Text Extractor ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
