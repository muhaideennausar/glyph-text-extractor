<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Base Shadow Filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#241f31" flood-opacity="0.25"/>
    </filter>
    <!-- Screen Surface Gradient -->
    <linearGradient id="surface-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f5f4"/>
    </linearGradient>
    <!-- Selection Box Gradient -->
    <linearGradient id="selection-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <!-- Scan Laser Gradient -->
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#62a0ea" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base App Plate (GNOME Squircle Plate) -->
  <rect x="14" y="14" width="100" height="100" rx="22" ry="22" fill="#deddda" filter="url(#drop-shadow)"/>
  <rect x="14" y="12" width="100" height="100" rx="22" ry="22" fill="url(#surface-grad)"/>

  <!-- Subtle Inner Border -->
  <rect x="14.5" y="12.5" width="99" height="99" rx="21.5" ry="21.5" fill="none" stroke="#ffffff" stroke-width="1"/>

  <!-- Screen Content: Typography Sample "Aa" -->
  <g id="typography-sample">
    <!-- Capital A -->
    <path d="M 46 80 L 40 80 L 53 44 L 59 44 L 72 80 L 66 80 L 63 71 L 49 71 Z M 51 66 L 61 66 L 56 52 Z" fill="#3d3846"/>
    <!-- Small a -->
    <path d="M 76 60 C 76 56 79 53 84 53 C 89 53 92 56 92 60 L 92 80 L 87 80 L 87 77 C 85 79.5 82 81 79 81 C 74 81 70 78 70 73 C 70 67 75 64 87 64 L 87 60 C 87 57 85 56 83 56 C 80 56 78 57 77 59 Z M 87 68 C 80 68 76 70 76 73 C 76 76 78 78 81 78 C 84 78 87 76 87 73 Z" fill="#5e5c64"/>
  </g>

  <!-- Interactive Selection Rectangle (Crop Viewfinder) -->
  <rect x="32" y="34" width="64" height="60" rx="8" ry="8" fill="#3584e4" fill-opacity="0.08" stroke="url(#selection-grad)" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Crop Corner Handles -->
  <!-- Top-Left -->
  <path d="M 28 44 L 28 32 L 40 32" fill="none" stroke="#1c71d8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top-Right -->
  <path d="M 88 32 L 100 32 L 100 44" fill="none" stroke="#1c71d8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-Left -->
  <path d="M 28 84 L 28 96 L 40 96" fill="none" stroke="#1c71d8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-Right -->
  <path d="M 88 96 L 100 96 L 100 84" fill="none" stroke="#1c71d8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Optical Laser Scanning Beam -->
  <rect x="34" y="62" width="60" height="4" rx="2" fill="url(#laser-grad)"/>
  <circle cx="64" cy="64" r="2" fill="#ffffff"/>

  <!-- Extracted Glyph Badge (Magnifier Lens Overlay) -->
  <g transform="translate(74, 74)">
    <circle cx="18" cy="18" r="16" fill="#3584e4" filter="url(#drop-shadow)"/>
    <circle cx="18" cy="18" r="14" fill="#62a0ea"/>
    <!-- Copy Icon Symbol inside badge -->
    <rect x="13" y="11" width="8" height="10" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <path d="M 16 15 L 23 15 C 23.8 15 24.5 15.7 24.5 16.5 L 24.5 23.5 C 24.5 24.3 23.8 25 23 25 L 17 25 C 16.2 25 15.5 24.3 15.5 23.5 L 15.5 21" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  </g>
</svg>

